<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Nashr Foundation</title>
    <meta name="description" content="Admin dashboard for Nashr Foundation - Monitor donations, manage leaderboard, and track website performance">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
    <link rel="preload" href="admin-styles.css" as="style">
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    
    <!-- Admin Styles -->
    <link rel="stylesheet" href="admin-styles.css">
    
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDKs will be dynamically imported by admin.js -->
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <div class="modal-brand">
                <img src="logo.webp" alt="Nashr Foundation" class="admin-logo" width="40" height="40">
                <h2>Admin Login</h2>
            </div>
            <p class="modal-subtitle">Sign in to manage the donor leaderboard.</p>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" class="input-lg" placeholder="name@example.com" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <div class="password-field">
                        <input type="password" id="admin-password" class="input-lg" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" aria-label="Show password" onclick="const i=document.getElementById('admin-password'); const show=i.type==='password'; i.type=show?'text':'password'; this.setAttribute('aria-label', show?'Hide password':'Show password'); this.textContent = show ? 'Hide' : 'Show';">Show</button>
                    </div>
                </div>
                <button type="submit" id="login-submit" class="btn btn-primary btn-lg full-width">Sign in</button>
            </form>
            <div id="login-error" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="admin-dashboard" style="display: none;">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-content">
                <div class="logo-section">
                    <img src="logo.webp" alt="Nashr Foundation Logo" class="admin-logo">
                    <h1>Admin Dashboard</h1>
                </div>
                <div class="header-actions">
                    <div class="user-info">
                        <span id="admin-user-email"></span>
                        <button id="logout-btn" class="btn btn-outline">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation (Simplified) -->
        <nav class="admin-nav">
            <ul>
                <li><a href="#leaderboard" class="nav-link active" data-section="leaderboard">Leaderboard</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Leaderboard Section -->
            <section id="leaderboard" class="dashboard-section active">
                <div class="section-header">
                    <h2>Leaderboard</h2>
                </div>
                <div class="leaderboard-editor">
                    <div class="current-leaderboard">
                        <div class="leaderboard-table-container">
                            <table class="admin-table" id="admin-leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Name</th>
                                        <th>Amount</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-leaderboard-body">
                                    <tr><td colspan="3" class="loading">Loading leaderboard...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="admin.js" defer></script>
</body>
</html>
