<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Nashr Foundation</title>
    <meta name="description" content="Admin dashboard for Nashr Foundation - Monitor donations, manage leaderboard, and track website performance">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
    <link rel="preload" href="admin-styles.css" as="style">
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    
    <!-- Admin Styles -->
    <link rel="stylesheet" href="admin-styles.css">
    
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDKs will be dynamically imported by admin.js -->
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal" style="display: flex;">
        <div class="modal-content" role="dialog" aria-labelledby="admin-login-title" aria-describedby="admin-login-desc">
            <div class="modal-brand">
                <img src="logo.webp" alt="Nashr Foundation" class="admin-logo" width="40" height="40">
                <h2 id="admin-login-title">Welcome back</h2>
            </div>
            <p id="admin-login-desc" class="modal-subtitle">Sign in to manage the donor leaderboard.</p>
            <form id="login-form" class="login-form" novalidate>
                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <div class="input-group">
                        <span class="input-icon" aria-hidden="true">✉️</span>
                        <input type="email" id="admin-email" class="input-lg" placeholder="name@example.com" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <div class="input-group password-field">
                        <span class="input-icon" aria-hidden="true">🔒</span>
                        <input type="password" id="admin-password" class="input-lg" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" aria-label="Show password" onclick="const i=document.getElementById('admin-password'); const show=i.type==='password'; i.type=show?'text':'password'; this.setAttribute('aria-label', show?'Hide password':'Show password'); this.textContent = show ? 'Hide' : 'Show';">Show</button>
                    </div>
                </div>
                <div class="form-row" style="align-items:center;">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="remember-me"> <span>Remember me</span>
                    </label>
                    <button type="button" class="btn btn-outline btn-sm" style="margin-left:auto;" onclick="alert('Password reset is managed in Firebase Console for admins.');">Forgot password?</button>
                </div>
                <div class="modal-actions">
                    <button type="submit" id="login-submit" class="btn btn-primary btn-lg full-width">Sign in</button>
                </div>
            </form>
            <div id="login-error" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="admin-dashboard" style="display: none;">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-content">
                <div class="logo-section">
                    <a href="index.html" aria-label="Go to homepage">
                        <img src="logo.webp" alt="Nashr Foundation Logo" class="admin-logo">
                    </a>
                    <h1>Admin Dashboard</h1>
                </div>
                <div class="header-actions">
                    <div class="user-info">
                        <span id="admin-user-email"></span>
                        <button id="logout-btn" class="btn btn-outline">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation (Simplified) -->
        <nav class="admin-nav">
            <ul>
                <li><a href="#leaderboard" class="nav-link active" data-section="leaderboard">Leaderboard</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Leaderboard Section -->
            <section id="leaderboard" class="dashboard-section active">
                <div class="section-header">
                    <h2>Leaderboard</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="addLeaderboardEntry()">Add Entry</button>
                        <button class="btn btn-secondary" onclick="exportLeaderboardCsv()">Export CSV</button>
                    </div>
                </div>
                <div class="leaderboard-editor">
                    <div class="current-leaderboard">
                        <div class="leaderboard-table-container">
                            <table class="admin-table" id="admin-leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Name</th>
                                        <th>Amount</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-leaderboard-body">
                                    <tr><td colspan="4" class="loading">Loading leaderboard...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="entry-form" id="entry-form" style="display: none;">
                        <h3 id="form-title">Add New Entry</h3>
                        <form id="leaderboard-form">
                            <input type="hidden" id="edit-entry-id">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="entry-name">Name</label>
                                    <input type="text" id="entry-name" required>
                                </div>
                                <div class="form-group">
                                    <label for="entry-amount">Amount (PKR)</label>
                                    <input type="number" id="entry-amount" min="1" required>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Save Entry</button>
                                <button type="button" class="btn btn-outline" onclick="cancelEdit()">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="admin.js" defer></script>
</body>
</html>
